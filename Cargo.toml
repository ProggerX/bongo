[package]
name = "bongo"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = {version = "1.0.229" , features = ["derive"]}
toml = "1.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13.2", features = ["tokio"] }
smithay-client-toolkit = { version = "0.20.0", default-features = false }
wayland-client = "0.31.14"
rustix = { version = "1.1", features = ["event"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
tokio = { version = "1.53.1", features = ["full"] }

[target.'cfg(target_os = "macos")'.dependencies]
glib = "0.22.8"
gtk4 = "0.11.4"
cocoa = "0.22.0"
